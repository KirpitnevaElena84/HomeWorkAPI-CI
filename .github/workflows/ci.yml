name: CI for AQA Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ВАЖНО: делаем gradlew исполняемым прямо на сервере CI
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Start SUT (app-mbank.jar)
        run: |
          nohup java -jar artifacts/app-mbank.jar > sut.log 2>&1 &
          echo "Waiting for service to start..."
          sleep 20

      - name: Run tests
        run: ./gradlew test
